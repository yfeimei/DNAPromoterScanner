# Streamlit settings that apply both locally and on Streamlit Community
# Cloud. Deliberately minimal: no server port/address is set here, because
# the hosting platform assigns those itself and overriding them breaks the
# deployment.

[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false

[client]
# Show a short, friendly message instead of a Python traceback if something
# goes wrong. Visitors to an educational tool shouldn't see a stack trace;
# the full error still appears in the Cloud logs for debugging.
showErrorDetails = "none"

[theme]
base = "dark"
backgroundColor = "#000000"          # the page itself
secondaryBackgroundColor = "#1a1a1a" # text box, expander, sidebar -- lifted
                                     # slightly so inputs stay visible
textColor = "#f5f5f5"                # near-white, softer on the eye than #fff
primaryColor = "#ff5c4a"             # brightened red for buttons/sliders: the
                                     # dark #c0392b used for the light theme
                                     # is hard to see on black. The base
                                     # highlighting in app/app.py uses a
                                     # deeper red of the same family, because
                                     # that one has white letters on top of it.
font = "sans serif"
